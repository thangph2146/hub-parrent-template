name: Deploy branches (legacy)

# Chỉ dùng khi vẫn deploy bằng branch hub-event/hub-parent trên CÙNG repo template.
# Mô hình mới: repo downstream + pnpm pull:template — xem docs/TEMPLATE_MONOREPO.md

on:
  workflow_dispatch:
    inputs:
      line:
        description: "Product line sync"
        required: true
        default: hub-event
        type: choice
        options:
          - hub-event
          - hub-parent
          - both

concurrency:
  group: deploy-branches-legacy
  cancel-in-progress: false

jobs:
  sync-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Legacy deploy push
        run: |
          ONLY="${{ github.event.inputs.line }}"
          if [ "$ONLY" = "both" ]; then
            node script-system/git/push-deploy-branches.cjs --only hub-event,hub-parent
          else
            node script-system/git/push-deploy-branches.cjs --only "$ONLY"
          fi
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
