name: Deploy branches

# Sau push main: sync hub-event + hub-parent → commit (nếu có) → push main + branch deploy.
# Bỏ qua khi commit sync hoặc [skip ci] để tránh vòng lặp.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-branches-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-and-push:
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(sync):')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync deploy lines and push branches
        run: node script-system/git/push-deploy-branches.cjs
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
